name: Build Test

# 构建测试分支专用：push 到 build-test 即触发，也可以手动跑。
# 只编 Debug，不签名、不发版，单纯验证源码能编译通过。

on:
  push:
    branches: [build-test]
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构'
        required: true
        type: choice
        default: universal
        options:
          - universal
          - arm
          - arm64
          - x86
          - x86_64

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      JAVA_VERSION: "17"

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: 配置 JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: always

      - name: 缓存 Bootstrap
        uses: actions/cache@v5
        with:
          path: app/src/main/cpp/bootstrap-*.zip
          key: bootstrap-${{ hashFiles('app/build.gradle') }}
          restore-keys: bootstrap-

      - name: 给 gradlew 执行权限
        run: chmod +x gradlew

      - name: 打印环境
        run: |
          echo "arch=${{ inputs.arch || 'universal' }}"
          ls -l phone.jks || echo "phone.jks 缺失"
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT" 2>/dev/null || true
          ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || echo "无 ndk 目录"

      - name: 编译 Debug APK (${{ inputs.arch || 'universal' }})
        run: |
          set +e
          ./gradlew --build-cache --stacktrace :app:assembleDebug \
            -Darch=${{ inputs.arch || 'universal' }} 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$code" >> $GITHUB_ENV
          exit $code

      - name: 回传构建错误片段
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) { log = '(no build.log)'; }
            const lines = log.split('\n');
            let idx = lines.findIndex(l => /What went wrong|FAILURE:|error:|Could not|Cannot|not found/i.test(l));
            if (idx < 0) idx = Math.max(0, lines.length - 80);
            const snippet = lines.slice(Math.max(0, idx - 3), idx + 60).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'build-test 失败 #' + context.runNumber,
              body: '```\n' + snippet.slice(0, 50000) + '\n```'
            });

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 上传 APK
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-debug-${{ inputs.arch || 'universal' }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
